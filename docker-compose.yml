services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ticketoff
      POSTGRES_PASSWORD: ticketoff
      POSTGRES_DB: ticketoff
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketoff -d ticketoff"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ticketoff:ticketoff@db:5432/ticketoff
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
