name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ticketoff
          POSTGRES_PASSWORD: ticketoff
          POSTGRES_DB: ticketoff
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketoff -d ticketoff"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://ticketoff:ticketoff@localhost:5432/ticketoff
      JWT_SECRET: ci-jwt-secret-not-for-production-0123456789
      TICKET_SIGNING_SECRET: ci-ticket-secret-not-for-production-01234

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Migrations apply
        run: uv run alembic upgrade head

      - name: Tests
        run: uv run pytest
