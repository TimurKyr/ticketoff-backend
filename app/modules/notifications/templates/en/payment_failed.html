{% extends "base.html" %}
{% block body %}
    <p>Your payment did not go through.</p>
    <h2 style="margin:16px 0 4px;font-size:20px;">{{ event_title }}</h2>
    <p style="margin:0;">{{ starts_at | local_dt(tz_name) }}<br>Amount: {{ amount_kzt | money }}</p>
    <p>Your tickets are still held for you. You can retry until <strong>{{ retry_until | local_dt(tz_name) }}</strong>.</p>
    <p><a href="{{ order_url }}">Retry the payment</a></p>
{% endblock %}
