{% extends "base.html" %}
{% block body %}
    <p>We received a request to reset the password of your ticketoff account.</p>
    <p><a href="{{ reset_url }}" style="display:inline-block;padding:10px 16px;background:#111;color:#fff;border-radius:6px;text-decoration:none;">Choose a new password</a></p>
    <p style="color:#6b7280;font-size:13px;">The link is valid for {{ expires_hours }} h and works once. If you didn't ask for this, just ignore this email: your password stays as it is.</p>
{% endblock %}
